# Keeps each channel branch on the newest upstream Omarchy for its channel,
# every 6 hours and on demand:
#
#   stable  the newest v4.* release
#   rc      the newest v4.* pre-release, or stable when that is newer
#   edge    upstream's `quattro` branch
#
# For each channel it points the `omarchy` input at that ref and re-locks it.
# When that changes anything, it runs the whole flake check (the NixOS VM
# test included) right here and pushes the update to the channel branch only
# when the check passes; a failing update leaves the channel as it was and
# shows as a failed run.
#
# The check runs in this job rather than in a PR's CI: PRs and pushes made
# with GITHUB_TOKEN don't start other workflows, and a CI run started by
# dispatch doesn't count for a PR's required checks. This way no personal
# token or secret is needed.
name: Update Omarchy

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, rc, edge]
    steps:
      - name: Find the upstream ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          releases=$(gh api --paginate repos/basecamp/omarchy/releases \
            --jq '.[] | select(.draft | not) | select(.tag_name | startswith("v4.")) | [.tag_name, .prerelease, .published_at] | @tsv')
          stable=$(awk -F'\t' '$2 == "false"' <<<"$releases" | sort -t$'\t' -k3 | tail -1)
          pre=$(awk -F'\t' '$2 == "true"' <<<"$releases" | sort -t$'\t' -k3 | tail -1)
          case "$CHANNEL" in
            stable) ref=$(cut -f1 <<<"$stable") ;;
            rc)
              # The newest pre-release, unless a release came out after it.
              if [[ -n $pre && ( -z $stable || $(cut -f3 <<<"$pre") > $(cut -f3 <<<"$stable") ) ]]; then
                ref=$(cut -f1 <<<"$pre")
              else
                ref=$(cut -f1 <<<"$stable")
              fi
              ;;
            edge) ref=quattro ;;
          esac
          if [[ -z $ref ]]; then
            echo "No upstream ref for $CHANNEL yet." >&2
            exit 0
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.ref.outputs.ref != ''
        with:
          ref: ${{ matrix.channel }}

      - uses: cachix/install-nix-action@v31
        if: steps.ref.outputs.ref != ''
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Re-lock the omarchy input
        if: steps.ref.outputs.ref != ''
        id: lock
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          sed -i -E "s|github:basecamp/omarchy/[^\"]*|github:basecamp/omarchy/$REF|" flake.nix
          nix flake update omarchy
          if git diff --quiet; then
            echo "Already on the newest $REF."
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      # The ecosystem checks pull in large apps (LibreOffice, Kdenlive, …).
      - name: Free disk space
        if: steps.lock.outputs.changed == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      # KVM for the NixOS VM test.
      - name: Enable KVM
        if: steps.lock.outputs.changed == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: nix flake check
        if: steps.lock.outputs.changed == 'true'
        run: nix flake check -L --show-trace

      - name: Push the update
        if: steps.lock.outputs.changed == 'true'
        env:
          REF: ${{ steps.ref.outputs.ref }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "omarchy: $REF ($(nix eval --raw --impure --expr '(builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.omarchy.locked.rev' | cut -c1-7))"
          git push origin "HEAD:$CHANNEL"
